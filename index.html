    </header>

    <main>
      <section class="entery">
        <header class="entery__entery-header">
          <h1 class="entery__title">Start Exploring</h1>
        </header>

        <form class="entery__post-form" id="post-form">
          <fieldset>
            <label class="entery__label-name" for="name-input">Name</label>
            <input
              type="text"
              name="name"
              id="name-input"
              placeholder="John Doe"
            />
          </fieldset>
          <fieldset>
            <label class="entery__label-location" for="location-input"
              >Location</label
            >
            <input
              type="text"
              name="location"
              id="location-input"
              placeholder="Miami Fl"
            />
          </fieldset>
          <fieldset>
            <label class="entery__label-date" for="date-input">Date</label>
            <input
              type="text"
              name="date"
              id="date-input"
              placeholder="March 1, 2026"
            />
          </fieldset>
          <fieldset>
            <label class="entery__label-notes" for="notes-input">Notes</label>
            <textarea
              name="notes"
              id="notes-input"
              placeholder="Write your observations"
            ></textarea>
          </fieldset>
          <button class="entery__post-button" type="submit">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 6.35 6.35"
            >
              <path
                fill="currentColor"
                d="M2.91 1.323v1.587H1.323v.53h1.587v1.587h.53v-1.587h1.587v-.53H3.44V1.323Z"
              />
            </svg>
            Add Post
          </button>
        </form>
      </section>
      <section class="filter"></section>
      <section class=""></section>
    </main>
  </body>
</html>
